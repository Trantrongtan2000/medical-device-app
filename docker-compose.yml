version: '3.8'

services:
  medical-device-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tamanh_htm_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./database:/app/database
      - ./docs:/app/docs
    environment:
      - ENVIRONMENT=production
      - DB_PATH=/app/database/devices.db
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/devices?limit=1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - htm_network

  # Nginx Reverse Proxy (Optional production gateway)
  nginx:
    image: nginx:alpine
    container_name: tamanh_htm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - medical-device-app
    networks:
      - htm_network

networks:
  htm_network:
    driver: bridge
